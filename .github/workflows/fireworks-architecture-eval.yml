name: Fireworks architecture evaluation
on:
  push:
    branches: [codex/eval-fireworks-minimax-20261025]
permissions:
  contents: read
concurrency:
  group: fireworks-architecture-eval
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .github/coding-review
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install review engine and Keenable
        run: python -m pip install ".[knowledge]"
      - name: Run identical six-case benchmark with default Fireworks model
        env:
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY || secrets.CODINGAGENT }}
          KEENABLE_API_KEY: ${{ secrets.KEENABLE_API_KEY }}
        run: |
          test -n "$FIREWORKS_API_KEY"
          python -m evals.run --output eval-output --repeats 1
      - name: Preserve portable evaluation results
        if: always()
        run: |
          python - <<'PY'
          import base64, io, zipfile
          from pathlib import Path
          stream = io.BytesIO()
          with zipfile.ZipFile(stream, 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(Path('eval-output').glob('*.json')):
                  archive.write(path, path.name)
          payload = base64.b64encode(stream.getvalue()).decode()
          for index, offset in enumerate(range(0, len(payload), 4000)):
              print(f'EVAL_ARCHIVE_CHUNK:{index}:{payload[offset:offset+4000]}')
          PY
      - name: Upload complete eval traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fireworks-minimax-architecture-eval
          path: .github/coding-review/eval-output/
          retention-days: 14
