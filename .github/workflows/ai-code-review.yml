name: Multi-agent AI code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted default-branch review engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Detect initial installation
        id: installation
        run: |
          if [ -f .github/coding-review/pyproject.toml ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Merge the review integration first; reviews activate on subsequent PR events.'
          fi
      - name: Set up Python
        if: steps.installation.outputs.ready == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install trusted review engine
        if: steps.installation.outputs.ready == 'true'
        run: python -m pip install ./.github/coding-review
      - name: Review PR source through Fireworks
        if: steps.installation.outputs.ready == 'true'
        env:
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY || secrets.CODINGAGENT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$FIREWORKS_API_KEY" ]; then
            echo '::error::Add FIREWORKS_API_KEY (or CODINGAGENT) under repository Settings > Secrets and variables > Actions.'
            exit 1
          fi
          python -m coding_review.integrations.github review
      - name: Publish or update prioritized PR report
        if: always() && steps.installation.outputs.ready == 'true' && hashFiles('review-output/report.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m coding_review.integrations.github publish
      - name: Save full report artifacts
        if: always() && hashFiles('review-output/report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: review-output/
          retention-days: 14
